<!DOCTYPE html>
<html lang="en">
<head>
    {{module=head.html}}
</head>
<body class="error">
    {{module=header.html}}
    
    <div class="content">
        <main class="main">
            <div class="error-content">
                <h1 class="listHeader">404 - Page Not Found</h1>
                
                <div class="error-text">
                    <p>The page you're looking for could not be found. It might have been moved, deleted, or you entered the wrong URL.</p>
                    
                    <div class="error-actions">
                        <a href="/" class="page-link">Go Home</a>
                        <a href="/contact" class="page-link">Contact Us</a>
                    </div>
                </div>
            </div>
        </main>
    </div>
    
    {{module=footer.html}}
</body>
</html>
